
<div id="appHeader">
<div class="appHeader bg-primary text-light">
    <div class="left">
        <a href="/home" class="headerButton goBack" id="goBackToMain">
            <ion-icon name="chevron-back-outline"></ion-icon>
        </a>
    </div>
    <div class="pageTitle">
        <strong id="ro_room_name"></strong>
    </div>
    <div class="right dropdown">
        <a href="#" class="headerButton" data-bs-toggle="dropdown" aria-expanded="false">
            <ion-icon name="ellipsis-horizontal"></ion-icon>
        </a>
        <div class="dropdown-menu dropdown-menu-end" style="">
            <a class="dropdown-item" href="#" onclick="EditActiveRoom()"><i class="bi bi-pencil-square"></i> Edit</a>
            <a class="dropdown-item" href="#" onclick="LeaveActiveRoomModal()"><i class="bi bi-trash"></i> Delete</a>
            <a class="dropdown-item" href="#" onclick="ShareActiveRoom()"><ion-icon name="share-social-outline"></ion-icon> Share</a>
        </div>
    </div>
</div>
</div>


<div id="appContent">

<div id="ct_room" class="chatContent">

</div>

<!-- * App Capsule -->

    <!-- chat footer -->
    <div class="chatFooter">
        <form action="javascript:await SendMessage()">
            <div class="form-group boxed">
                <div class="input-wrapper">
                    <textarea id="ct_msg_input" rows="1" class="form-control" oninput="auto_height(this)" style=" width: 100%;"></textarea>

                    <i class="clear-input">
                        <ion-icon name="close-circle"></ion-icon>
                    </i>
                </div>
            </div>
            <button type="button" class="btn btn-icon btn-primary rounded" onclick="SendMessage()">
                <ion-icon name="send"></ion-icon>
            </button>
        </form>
    </div>
    <!-- * chat footer -->

<!-- Modal Share Room -->
<div class="modal fade modalbox" id="ct_share_room" data-bs-backdrop="static" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">ChatBit</h5>
                <a href="#" data-bs-dismiss="modal">Close</a>
            </div>
            <div class="modal-body">
                <div class="login-form">
                    <div class="section mt-2">
                        <h1>Share Room</h1>
                        <h4>Scan QR Code to join this Chat</h4>
                    </div>
                    <div class="section mt-4 mb-5">
                        <div id="ct_qr_code"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- * Modal Share Room -->

    <!-- Leave Room-->
    <div class="modal fade dialogbox" id="ct_leave_room" data-bs-backdrop="static" tabindex="-1" style="display: none;" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Leave Room</h5>
                </div>
                <div class="modal-body">
                    You want to leave this room?
                </div>
                <div class="modal-footer">
                    <div class="btn-list">
                        <a href="#" class="btn btn-text-danger btn-block" data-bs-dismiss="modal" onclick="LeaveActiveRoom()">
                            <i class="bi bi-trash"></i>
                            DELETE
                        </a>
                        <a href="#" class="btn btn-text-primary btn-block" data-bs-dismiss="modal">
                            CANCEL
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- Modal Edit Room -->
    <div class="modal fade modalbox" id="ct_edit_room" data-bs-backdrop="static" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">ChatBit</h5>
                    <a href="#" data-bs-dismiss="modal">Close</a>
                </div>
                <div class="modal-body">
                    <div class="login-form">
                        <div class="section mt-2">
                            <h1>Edit Room</h1>
                            <h4>Fill the form to update the Chat Room</h4>
                        </div>
                        <div class="section mt-4 mb-5">
                            <form action="javascript:UpdateRoom()" >
                                <div class="form-group basic">
                                    <div class="input-wrapper">
                                        <label class="form-label" for="ct_edit_room_name">Room Name</label>
                                        <input type="text" class="form-control" id="ct_edit_room_name"
                                               placeholder="Room Name">
                                        <i class="clear-input">
                                            <ion-icon name="close-circle"></ion-icon>
                                        </i>
                                    </div>
                                </div>

                                <ul class="listview simple-listview">
                                    <li>
                                        <div>Push Notifications</div>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="ct_edit_room_push">
                                            <label class="form-check-label" for="ct_edit_room_push"></label>
                                        </div>
                                    </li>
                                </ul>

                                <div class="mt-2">
                                    <button type="submit" class="btn btn-primary btn-block btn-lg">Update Room</button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- * Modal Add Room -->



<!-- Text tdo long-->
<div id="ct_msg_maxlength" class="notification-box">
    <div class="notification-dialog ios-style bg-danger">
        <div class="notification-header">
            <div class="right">
                <a href="#" class="close-button">
                    <ion-icon name="close-circle"></ion-icon>
                </a>
            </div>
        </div>
        <div class="notification-content">
            <div class="in">
                <h3 class="subtitle">Max length is 1024 charts</h3>
                <div class="text">
                    Please make you message shorter...
                </div>
            </div>
        </div>
    </div>
</div>
</div>
