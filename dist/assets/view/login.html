<div id="appHeader">
</div>


<div id="appContent">
    <div id="appCapsule" class="pt-0">
        <div class="login-form mt-1">
            <br><br>
            <div class="section">
                <img src="assets/img/LogoBenoni.svg" alt="image" class="form-image">
            </div>
            <br>
            <div class="section mt-1">
                <h1>ChatBit</h1>
                <h4>Fill the form to log in</h4>
            </div>
            <div class="section mt-1 mb-5">
                <form id="login_submit">
                    <div class="form-group boxed">
                        <div class="input-wrapper">
                            <input type="text" class="form-control" id="lo_alias" placeholder="Alias">
                            <i class="clear-input">
                                <ion-icon name="close-circle"></ion-icon>
                            </i>
                        </div>
                    </div>

                    <div class="form-group boxed">
                        <div class="input-wrapper">
                            <input type="password" class="form-control" id="lo_password" placeholder="Password" autocomplete="off">
                            <i class="clear-input">
                                <ion-icon name="close-circle"></ion-icon>
                            </i>
                        </div>
                    </div>

                    <div class="form-button-group">
                        <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
