<div id="appHeader">
    <div class="appHeader transparent">


        <div class="right">
            <a href="#" class="headerButton" data-bs-toggle="offcanvas"
               data-bs-target="#actionSheetDefaultInset">
                <ion-icon name="ellipsis-horizontal"></ion-icon>
            </a>
        </div>
    </div>

    <div class="offcanvas offcanvas-bottom action-sheet inset" tabindex="-1" id="actionSheetDefaultInset">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Actions</h5>
        </div>
        <div class="offcanvas-body">
            <ul class="action-button-list">
                <li>
                    <a href="#" class="btn btn-list" onclick="Logout()">
                        <span>Remove Database</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>


<div id="appContent">
    <div id="appCapsule" class="pt-0">
        <div class="login-form mt-1">
            <br><br>
            <div class="section">
                <img src="assets/img/LogoBenoni.svg" alt="image" class="form-image">
            </div>
            <div class="pageTitle" style="text-align: center">
                <br>
                <h1>Locked</h1>
                <h4>Local Database is locked</h4>
            </div>
            <div class="section mt-5">
                <h2 id="ls_alias">alias</h2>
            </div>

            <div class="section mt-3 mb-5">
                <form id="lock_submit" >

                    <div class="form-group boxed">
                        <div class="input-wrapper">
                            <input type="password" class="form-control" id="ls_password" placeholder="Password"
                                autocomplete="off">
                            <i class="clear-input">
                                <ion-icon name="close-circle"></ion-icon>
                            </i>
                        </div>
                    </div>

                    <div class="form-button-group">
                        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
    <!-- * App Capsule -->

    <!-- ios style-->
    <div id="ls_pwd_incorrect" class="notification-box">
        <div class="notification-dialog ios-style bg-danger">
            <div class="notification-header">
                <div class="right">
                    <button type="button" class="close-button" onclick="this.closest('.notification-box').classList.remove('show')" aria-label="Close">
                        <ion-icon name="close-circle"></ion-icon>
                    </button>
                </div>
            </div>
            <div class="notification-content">
                <div class="in">
                    <h3 class="subtitle">Password incorrect...</h3>
                    <div class="text">
                        Please try it again.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
